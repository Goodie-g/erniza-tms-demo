services:
  tms-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: erniza-tms-demo:local
    ports:
      - "4000:10000"
    environment:
      # Local Docker testing is plain HTTP, so use development cookies.
      # (NODE_ENV=production forces Secure cookies and needs HTTPS.)
      NODE_ENV: development
      PORT: "10000"
      APP_URL: http://localhost:4000
      API_PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:4000
      LOG_LEVEL: info
    restart: unless-stopped
